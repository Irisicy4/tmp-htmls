<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trips &amp; Match Watching — Flight Map</title>
<style>
  :root {
    color-scheme: dark;
    --bg:        #0a0d12;
    --land:      #151b24;
    --coast:     #2c3a4e;
    --border:    #1c242f;
    --ink:       #eaf2ff;
    --ink-2:     #93a4bb;
    --muted:     #5c6b80;
    --route:     #4da3ff;
    --wc:        #f4762e;
    --nba:      #9d8cff;
    --gig:      #e87ba4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 90% at 30% 20%, #0e141d 0%, var(--bg) 60%);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #stage { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  svg#map { width: 100%; height: 100%; display: block; }
  @media (max-width: 720px) {
    body { overflow: auto; }
    #stage { justify-content: flex-start; }
    svg#map { min-width: 920px; }
  }
  svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  .land    { fill: var(--land); stroke: var(--coast); stroke-width: 0.7; }
  .borders { fill: none; stroke: var(--border); stroke-width: 0.6; }

  .arc-glow { fill: none; stroke: var(--route); stroke-linecap: round; opacity: 0.12; }
  .arc-core { fill: none; stroke: var(--route); stroke-linecap: round; opacity: 0.75; }
  .arc-hit  { fill: none; stroke: transparent; stroke-width: 13; cursor: pointer; }
  g.route:hover .arc-core { opacity: 1; stroke: #8cc4ff; }
  g.route:hover .arc-glow { opacity: 0.3; }

  .ap-dot   { fill: #dceaff; stroke: var(--bg); stroke-width: 1.6; }
  .ap-label { fill: var(--ink-2); font-size: 9.5px; font-weight: 650; letter-spacing: 0.04em; }

  .title-kicker { fill: var(--route); font-size: 12px; font-weight: 800; letter-spacing: 0.34em; }
  .title-big    { fill: var(--ink); font-size: 46px; font-weight: 850; letter-spacing: 0.01em; }
  .title-sub    { fill: var(--ink-2); font-size: 12.5px; }
  .stat-val   { fill: var(--ink); font-size: 21px; font-weight: 800; }
  .stat-label { fill: var(--muted); font-size: 9.5px; font-weight: 700; letter-spacing: 0.14em; }

  .tag-box    { fill: rgba(13,17,24,0.88); stroke-width: 1.2; rx: 9px; }
  .tag-box.wc  { stroke: var(--wc); }
  .tag-box.nba { stroke: var(--nba); }
  .tag-box.gig { stroke: var(--gig); }
  .tag-kicker { fill: var(--ink-2); font-size: 7.5px; font-weight: 750; letter-spacing: 0.1em; }
  .tag-title  { fill: var(--ink); font-size: 14px; font-weight: 800; }
  .tag-meta   { fill: var(--ink-2); font-size: 8.5px; }
  .icon-ring  { fill: none; stroke: rgba(255,255,255,0.28); stroke-width: 0.8; }
  .leader { fill: none; stroke-width: 1; opacity: 0.55; stroke-dasharray: 3 3; }
  .leader.wc  { stroke: var(--wc); }
  .leader.nba { stroke: var(--nba); }
  .leader.gig { stroke: var(--gig); }
  .anchor.wc  { fill: var(--wc); }
  .anchor.nba { fill: var(--nba); }
  .anchor.gig { fill: var(--gig); }

  .foot { fill: var(--muted); font-size: 8px; }

  #tip {
    position: fixed; pointer-events: none; z-index: 50; display: none;
    background: rgba(13,17,24,0.95); color: var(--ink);
    border: 1px solid #2c3a4e; border-radius: 8px;
    padding: 7px 10px; font-size: 12.5px; line-height: 1.45;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4); max-width: 260px;
  }
  #tip .t-head { font-weight: 700; }
  #tip .t-sub  { color: var(--ink-2); }
</style>
</head>

</div>
<div id="tip"></div>

   anchor:[33.958,-118.342], x:396, y:386, w:206}

/* team icons: simplified national flags + NBA team-color chips */
const FLAGS = {
  POR: {type:'por'},
  COD: {type:'cod'},
  GER: {type:'h', bands:['#000000','#DD0000','#FFCE00']},
  PAR: {type:'h', bands:['#D52B1E','#FFFFFF','#0038A8']},
  FRA: {type:'v', bands:['#0055A4','#FFFFFF','#EF4135']},
  SWE: {type:'nordic', field:'#006AA7', cross:'#FECC02'}
};
const CHIPS = { OKC:['#007AC1','#EF3B24'], LAL:['#552583','#FDB927'], NYK:['#006BB6','#F58426'], CLE:['#860038','#FDBB30'], LAC:['#C8102E','#1D428A'], MIL:['#00471B','#EEE1C6'], HOU:['#CE1141','#C4CED4'] };

/* ---- helpers ---- */
const NS='http://www.w3.org/2000/svg';
const svg = document.getElementById('map');
function el(name, attrs, parent) {
  const n = document.createElementNS(NS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  (parent||svg).appendChild(n);
  return n;
}
function txt(x, y, cls, str, anchor) {
  const t = el('text', {x, y, class:cls});
  if (anchor) t.setAttribute('text-anchor', anchor);
  t.textContent = str;
  return t;
}
function haversineMi(a, b) {
  const R=3959, r=Math.PI/180;
  const h = Math.sin((b[0]-a[0])*r/2)**2 + Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin((b[1]-a[1])*r/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const tip = document.getElementById('tip');
function moveTip(e) {
  const pad=14; let x=e.clientX+pad, y=e.clientY+pad;
  const r = tip.getBoundingClientRect();
  if (x+r.width > innerWidth-8)  x = e.clientX-r.width-pad;
  if (y+r.height > innerHeight-8) y = e.clientY-r.height-pad;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hover(node, htmlFn) {
  node.addEventListener('pointerenter', e => { tip.innerHTML=htmlFn(); tip.style.display='block'; moveTip(e); });
  node.addEventListener('pointermove', moveTip);
  node.addEventListener('pointerleave', () => tip.style.display='none');
}

/* ---- land ---- */
el('path', {d: NATION_PATH,  class:'land'});
el('path', {d: BORDERS_PATH, class:'borders'});

/* ---- routes ---- */
const routes = {};
for (const [,f,t] of FLIGHTS) {
  const k = [f,t].sort().join('-');
  (routes[k] = routes[k] || {a:f, b:t, n:0}).n++;
}
const gRoutes = el('g', {});
for (const k in routes) {
  const r = routes[k];
  const [x1,y1] = px(...AIRPORTS[r.a]), [x2,y2] = px(...AIRPORTS[r.b]);
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1;
  const bow = Math.min(34, len*0.15);
  const cx=(x1+x2)/2 - dy/len*bow, cy=(y1+y2)/2 + dx/len*bow;
  const d = `M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;
  const g = el('g', {class:'route'}, gRoutes);
  el('path', {d, class:'arc-glow', 'stroke-width': 4 + r.n*1.6}, g);
  el('path', {d, class:'arc-core', 'stroke-width': 0.9 + r.n*0.45}, g);
  const hit = el('path', {d, class:'arc-hit'}, g);
  const mi = Math.round(haversineMi(AIRPORTS[r.a], AIRPORTS[r.b]));
  hover(hit, () => `<div class="t-head">${r.a} ↔ ${r.b}</div><div class="t-sub">${r.n} flight${r.n>1?'s':''} · ~${mi.toLocaleString()} mi each way</div>`);
}

/* ---- airports ---- */
const visits = {};
for (const [,f,t] of FLIGHTS) { visits[f]=(visits[f]||0)+1; visits[t]=(visits[t]||0)+1; }
const gAp = el('g', {});
for (const c in AIRPORTS) {
  const [x,y] = px(...AIRPORTS[c]);
  const r = 2.4 + Math.min(4, visits[c]*0.35);
  const dot = el('circle', {cx:x, cy:y, r, class:'ap-dot'}, gAp);
  hover(dot, () => `<div class="t-head">${c}</div><div class="t-sub">${visits[c]} flight leg${visits[c]>1?'s':''}</div>`);
  const east = AIRPORTS[c][1] > -90;
  let lx = east ? x+r+4 : x-r-4, ly = y+3.5, anchor = east ? null : 'end';
  if (c==='JFK') ly = y+11;
  if (c==='LGA') ly = y-6;
  if (c==='SFO') { ly = y+10; }
  if (c==='SJC') { ly = y-4; }
  if (c==='MCO') { lx = x-r-4; anchor = 'end'; }
  txt(lx, ly, 'ap-label', c, anchor);
}

/* ---- match tags ---- */
let iconSeq = 0;
function drawFlag(parent, x, y, code, w, h) {
  const f = FLAGS[code], id = 'icon-clip-' + (iconSeq++);
  const clip = el('clipPath', {id}, parent);
  el('rect', {x, y, width:w, height:h, rx:2}, clip);
  const g = el('g', {'clip-path':`url(#${id})`}, parent);
  if (f.type === 'h') f.bands.forEach((c,i) => el('rect', {x, y:y+h/3*i, width:w, height:h/3, fill:c}, g));
  if (f.type === 'v') f.bands.forEach((c,i) => el('rect', {x:x+w/3*i, y, width:w/3, height:h, fill:c}, g));
  if (f.type === 'nordic') {
    el('rect', {x, y, width:w, height:h, fill:f.field}, g);
    el('rect', {x:x+w*0.3, y, width:w*0.16, height:h, fill:f.cross}, g);
    el('rect', {x, y:y+h*0.4, width:w, height:h*0.2, fill:f.cross}, g);
  }
  if (f.type === 'por') {
    el('rect', {x, y, width:w*0.4, height:h, fill:'#046A38'}, g);
    el('rect', {x:x+w*0.4, y, width:w*0.6, height:h, fill:'#DA291C'}, g);
    el('circle', {cx:x+w*0.4, cy:y+h/2, r:2.6, fill:'#FFE900'}, g);
    el('circle', {cx:x+w*0.4, cy:y+h/2, r:1.2, fill:'#DA291C'}, g);
  }
  if (f.type === 'cod') {
    el('rect', {x, y, width:w, height:h, fill:'#007FFF'}, g);
    el('line', {x1:x, y1:y+h, x2:x+w, y2:y, stroke:'#F7D618', 'stroke-width':5.5}, g);
    el('line', {x1:x, y1:y+h, x2:x+w, y2:y, stroke:'#CE1021', 'stroke-width':3.5}, g);
    const st = txt(x+4.5, y+6.5, '', '★');
    st.setAttribute('text-anchor', 'middle');
    st.setAttribute('font-size', '5.5');
    st.setAttribute('fill', '#F7D618');
    g.appendChild(st);
  }
  if (f.star) {
    const s = txt(x+w/2, y+h/2+2.6, '', '★');
    s.setAttribute('text-anchor', 'middle');
    s.setAttribute('font-size', '7');
    s.setAttribute('fill', f.star);
    g.appendChild(s);
  }
  el('rect', {x, y, width:w, height:h, rx:2, class:'icon-ring'}, parent);
}
function drawChip(parent, x, y, code, w, h) {
  const [c1,c2] = CHIPS[code], id = 'icon-clip-' + (iconSeq++);
  const clip = el('clipPath', {id}, parent);
  el('rect', {x, y, width:w, height:h, rx:3}, clip);
  const g = el('g', {'clip-path':`url(#${id})`}, parent);
  el('rect', {x, y, width:w, height:h, fill:c1}, g);
  el('path', {d:`M${x+w},${y} L${x+w},${y+h} L${x},${y+h} Z`, fill:c2}, g);
  el('rect', {x, y, width:w, height:h, rx:3, class:'icon-ring'}, parent);
}
const gTags = el('g', {});
/* pass 1: anchors + leaders, so every leader runs under every card */
for (const t of TAGS) {
  const [ax,ay] = px(...t.anchor);
  el('circle', {cx:ax, cy:ay, r:2.6, class:'anchor '+t.kind}, gTags);
  const bx=t.x, by=t.y, bw=t.w, bh=60;
  /* leader from nearest box edge to anchor */
  const ex = ax < bx ? bx : (ax > bx+bw ? bx+bw : ax);
  const ey = ay < by ? by : (ay > by+bh ? by+bh : ay);
  const mx=(ex+ax)/2, my=(ey+ay)/2 - 10;
  el('path', {d:`M${ex},${ey} Q${mx},${my} ${ax},${ay}`, class:'leader '+t.kind}, gTags);
}
/* pass 2: cards */
for (const t of TAGS) {
  const bx=t.x, by=t.y, bw=t.w, bh=60;
  el('rect', {x:bx, y:by, width:bw, height:bh, rx:9, class:'tag-box '+t.kind}, gTags);
  txt(bx+12, by+15, 'tag-kicker', t.kicker);
  const iw = t.iconL.flag ? 22 : 15, ih = 14, iy = by + 21;
  const drawIcon = (icon, x) => {
    if (icon.flag) drawFlag(gTags, x, iy, icon.flag, iw, ih);
    else if (icon.chip) drawChip(gTags, x, iy, icon.chip, iw, ih);
    else if (icon.note) {
      el('rect', {x, y:iy, width:iw, height:ih, rx:3, fill:'var(--gig)'}, gTags);
      const n = txt(x+iw/2, iy+10.5, '', '♪', 'middle');
      n.setAttribute('font-size', '10'); n.setAttribute('fill', '#0d1118'); n.setAttribute('font-weight', '700');
      gTags.appendChild(n);
      el('rect', {x, y:iy, width:iw, height:ih, rx:3, class:'icon-ring'}, gTags);
    }
  };
  drawIcon(t.iconL, bx+12);
  if (t.iconR) drawIcon(t.iconR, bx+bw-12-iw);
  const title = txt(bx+bw/2, by+32.5, 'tag-title', t.title);
  title.setAttribute('text-anchor', 'middle');
  txt(bx+12, by+46, 'tag-meta', t.meta1);
  txt(bx+12, by+55.5, 'tag-meta', t.meta2);
}

/* ---- title & stats ---- */
const totalMi = Math.round(FLIGHTS.reduce((s,[,f,t]) => s + haversineMi(AIRPORTS[f], AIRPORTS[t]), 0));
txt(42, 68, 'title-kicker', 'OCT 2025 — JUL 2026');
txt(40, 112, 'title-big', 'TRIPS &');
txt(40, 154, 'title-big', 'MATCH WATCHING');
txt(42, 178, 'title-sub', 'From Apple Wallet & Ticketmaster passes');

const stats = [
  [String(FLIGHTS.length), 'FLIGHTS'],
  [(totalMi/1000).toFixed(1)+'K', 'MILES'],
  [String(Object.keys(AIRPORTS).length), 'AIRPORTS'],
  ['8', 'MATCHES']
];
stats.forEach((s, i) => {
  const x = 42 + i*86;
  txt(x, 218, 'stat-val', s[0]);
  txt(x, 232, 'stat-label', s[1]);
});

txt(996, 464, 'foot',
