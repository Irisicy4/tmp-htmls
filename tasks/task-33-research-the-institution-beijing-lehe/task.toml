version = "1.0"

[metadata]
category = "Medical & Clinical & Bio"
tags = ["evolvebench", "web_nagivation", "save_to_document"]

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 300.0

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
OPENAI_BASE_URL = "${LLM_BASE_URL}"

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 10240
allow_internet = true
# 20 min for Modal: Playwright + Chromium install is slow on cloud build
build_timeout_sec = 1200.0
